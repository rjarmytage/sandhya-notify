name: SandhyaApp
options:
  bundleIdPrefix: com.armytage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SandhyaApp:
    type: application
    platform: iOS
    sources:
      - path: SandhyaApp
    info:
      path: SandhyaApp/Info.plist
      properties:
        CFBundleDisplayName: Sandhya
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Sandhya uses your location only to calculate the exact times of sunrise, sunset, and
          solar noon where you are. Always access lets it keep these times accurate automatically
          as you travel, even when the app isn't open. Your location is never stored or sent
          anywhere.
        NSLocationWhenInUseUsageDescription: >-
          Sandhya uses your location only to calculate the exact times of sunrise, sunset, and
          solar noon where you are. Your location is never stored or sent anywhere.
        UIBackgroundModes:
          - location
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.armytage.sandhya.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.armytage.sandhya
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES

  SandhyaAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SandhyaAppTests
    dependencies:
      - target: SandhyaApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.armytage.sandhya.tests

schemes:
  SandhyaApp:
    build:
      targets:
        SandhyaApp: all
        SandhyaAppTests: [test]
    test:
      targets:
        - SandhyaAppTests
    run:
      config: Debug
